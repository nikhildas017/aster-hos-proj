<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <th>doctor_name</th>
            <th>doctor_img</th>
            <th>dept_name</th>
        </tr>
        {% for i in data %}
            <tr>
                <td>{{i.doctor_name}}</td>
                <td><img src="{{i.doctor_img.url}}" alt="" width="100px" height="100px"/></td>
                <td>{{i.dept_name}}</td>
            </tr>
        {% endfor %}
    </table>
   
    <a href="{% url 'index' %}">Go back to home</a>
</body>
</html>
